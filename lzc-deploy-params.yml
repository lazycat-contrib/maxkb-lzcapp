params:
  - id: default_password
    type: secret
    name: Initial admin password
    description: >-
      Initial password for the default admin account. Kept secret in deployment
      parameters; login autofill is not used because the login form requires a
      first-time password change.
    default_value: "$random(len=12)"
    optional: false
locales:
  zh:
    default_password:
      name: 初始管理员密码
      description: 默认账号 admin 的初始密码，仅首次登录有效，首次登录后请立即在应用内修改。
