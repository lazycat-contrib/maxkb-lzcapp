params:
  - id: default_password
    type: secret
    name: Admin password
    description: Initial password for the admin account. Update this if the password is changed inside MaxKB, so autofill stays synchronized.
    default_value: "$random(len=16)"
    optional: false
locales:
  zh:
    default_password:
      name: 管理员密码
      description: admin 账号的初始随机密码；应用内改密后请同步更新这里，登录页会填充但不会自动提交。
