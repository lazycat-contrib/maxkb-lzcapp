application:
  subdomain: maxkb
  multi_instance: false
  upstreams:
    - location: /
      backend: http://maxkb:8080/
  injects:
    - id: initial-admin-autofill
      on: browser
      when:
        - /admin/login
        - /admin/login/
      do:
        - src: builtin://simple-inject-password
          params:
            user: admin
            password: |-
              {{ .U.default_password | replace "\r" "" | replace "\n" "\n              " }}
            userSelector: "input[type='text']"
            passwordSelector: "input[type='password']"
            autoSubmit: false
services:
  maxkb:
    # upstream: docker.io/1panel/maxkb:v2.10.8-lts
    image: docker.1ms.run/1panel/maxkb:v2.10.8-lts
    environment:
      - MAXKB_CONFIG_TYPE=ENV
      - POSTGRES_USER=maxkb
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD={{ stable_secret "maxkb-postgres" }}
      - MAXKB_DB_HOST=127.0.0.1
      - MAXKB_DB_PORT=5432
      - MAXKB_DB_NAME=maxkb
      - MAXKB_DB_USER=maxkb
      - MAXKB_DB_PASSWORD={{ stable_secret "maxkb-postgres" }}
      - REDIS_PASSWORD={{ stable_secret "maxkb-redis" }}
      - MAXKB_REDIS_HOST=127.0.0.1
      - MAXKB_REDIS_PORT=6379
      - MAXKB_REDIS_DB=0
      - MAXKB_REDIS_PASSWORD={{ stable_secret "maxkb-redis" }}
      - MAXKB_SECRET_KEY={{ stable_secret "maxkb-django" }}
      - |-
        MAXKB_DEFAULT_PASSWORD={{ .U.default_password | replace "\r" "" | replace "\n" "\n        " }}
    binds:
      - /lzcapp/var/data:/opt/maxkb
usage: |
  MaxKB 是企业级智能体平台，支持 RAG 知识库、工作流和 MCP 工具调用。
  首次使用默认账号 admin，初始密码取自部署参数，登录页仅自动填充、不自动提交，避免触发验证码和锁定。
  如果在应用内修改管理员密码，请同步更新部署参数，供后续自动填充使用；不会重置已有数据库中的密码。
  PostgreSQL、Redis 和应用共用本容器，持久数据位于应用内部目录，卸载前请备份。
  本包用于全新 v2 部署，不支持直接挂入 MaxKB v1 的数据库目录。首次初始化可能需要数分钟。
  模型接入需自行配置本地或第三方服务；不包含任何模型服务的 API 凭据。
  按用户要求，本版本未执行容器 smoke 检查或懒猫实机运行测试；已做构建、镜像交付及包完整性验证。
